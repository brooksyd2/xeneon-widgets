<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>'Focus spike'</title>
<link rel="icon" type="image/svg+xml" href="icon.svg" />
<meta name="x-icue-property" content="apiKey" data-label="tr('Obsidian API key')" data-type="textfield" data-default="''" />
<script type="application/json" id="x-icue-groups">
[{ "title": "Obsidian", "properties": ["apiKey"], "info": "Paste the MCP plugin API key." }]
</script>

</head>
<body>
<style>
html, body { margin: 0; height: 100%; background: #0b0d10; color: #e8eaed; font-family: Consolas, monospace; }
#log { height: 100%; overflow-y: auto; box-sizing: border-box; padding: 10px 16px; font-size: 22px; line-height: 1.25; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.step { margin: 0 0 12px; padding-bottom: 8px; border-bottom: 1px solid #333; word-break: break-all; white-space: pre-wrap; }
.ok { color: #4ade80; font-weight: bold; } .fail { color: #f87171; font-weight: bold; } .run { color: #fbbf24; }
.body { color: #cbd5e1; }
@media (min-width: 2000px) { #log { font-size: 40px; padding: 16px 40px; } }
</style>
<div id="log"></div>
<script>
var URL_ = 'http://localhost:3001/mcp', key = '', sid = null, nid = 10;
var logEl = document.getElementById('log');
function line(name) {
  var d = document.createElement('div'); d.className = 'step';
  d.innerHTML = '<span class="run">... </span><b></b><div class="body"></div>';
  d.querySelector('b').textContent = name; logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  return function (ok, info, body) {
    var s = d.querySelector('span'); s.className = ok ? 'ok' : 'fail'; s.textContent = (ok ? 'OK ' : 'FAIL ') + info + ' ';
    d.querySelector('.body').textContent = String(body == null ? '' : body).slice(0, 300);
  };
}
function post(payload) {
  var h = { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'Accept': 'application/json, text/event-stream' };
  if (sid) h['mcp-session-id'] = sid;
  return fetch(URL_, { method: 'POST', headers: h, body: JSON.stringify(payload) }).then(function (r) {
    return r.text().then(function (t) { return { status: r.status, sid: r.headers.get('mcp-session-id'), text: t }; });
  });
}
function data(t) { var m = /data: (.*)/.exec(t); try { return JSON.parse(m ? m[1] : t); } catch (e) { return null; } }
function step(name, payload, extra) {
  var done = line(name);
  return post(payload).then(function (r) {
    var info = 'HTTP ' + r.status, ok = r.status >= 200 && r.status < 300;
    if (extra) { var x = extra(r); if (x) info += ' ' + x; }
    done(ok, info, r.text); return r;
  }, function (e) { done(false, 'JS error', e && e.message || e); });
}
function tool(name, tname, args, extra) {
  return step(name, { jsonrpc: '2.0', id: nid++, method: 'tools/call', params: { name: tname, arguments: args } }, extra);
}
var F = 'Focus Spike Test.md';
function run() {
  var p = step('1 initialize', { jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: '2025-06-18', capabilities: {}, clientInfo: { name: 'focus-spike', version: '0' } } },
    function (r) { sid = r.sid; return 'session header ' + (sid ? 'READABLE' : 'NOT readable'); });
  p = p.then(function () { return step('2 notifications/initialized', { jsonrpc: '2.0', method: 'notifications/initialized' }); });
  p = p.then(function () { return tool('3 task query', 'dataview', { action: 'query', raw: true, query: 'TASK WHERE !completed AND status = " " AND !contains(file.path, "🔧 Templates")' }, function (r) {
    try { var v = JSON.parse(data(r.text).result.content[0].text).result.values; return 'tasks=' + v.length; } catch (e) { return 'tasks=? ' + e.message; } }); });
  p = p.then(function () { return tool('4 vault create', 'vault', { action: 'create', path: F, content: 'line A\nline B\nline C' }); });
  p = p.then(function () { return tool('5 view file raw', 'view', { action: 'file', path: F, raw: true }); });
  p = p.then(function () { return tool('6a edit at_line 1 replace', 'edit', { action: 'at_line', path: F, lineNumber: 1, mode: 'replace', content: 'REPLACED' }); });
  p = p.then(function () { return tool('6b view file again', 'view', { action: 'file', path: F, raw: true }); });
  p = p.then(function () { return tool('7 dataview LIST', 'dataview', { action: 'query', raw: true, query: 'LIST FROM "Entities/People"' }); });
  p.then(function () { line('DONE')(true, 'all steps attempted', ''); });
}
var started = false;
function start() { if (started) return; started = true; key = (window.apiKey || '').trim(); if (!key) line('apiKey')(false, 'empty', 'Paste the key in widget settings'); run(); }
window.icueEvents = { onICUEInitialized: function () { setTimeout(start, 200); }, onDataUpdated: function () {} };
if (window.iCUE_initialized || !window.iCUE) start();
</script>
</body>
</html>
